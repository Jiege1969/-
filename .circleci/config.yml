version: 2.1

jobs:
  safe-ci:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Show runtime versions
          command: |
            python --version
            git --version
      - run:
          name: Run safe offline CI checks
          command: |
            python ci/construction_assistant_report.py
            python ci/stock_sample_room_ci_check.py
            python ci/stock_mainline_ci_check.py
            python ci/stock_maturity_ci_check.py
            python ci/stock_consolidation_index_ci_check.py
            python ci/stock_closure_panel_ci_check.py
            python ci/stock_quality_evidence_ci_check.py
            python ci/stock_sample_pool_ci_check.py
            python ci/stock_manual_review_ci_check.py
            python ci/stock_pre_push_gate_ci_check.py
            python ci/stock_review_loop_ci_check.py
            python ci/stock_safe_boundary_ci_check.py
            python ci/stock_system_contract_ci_check.py
            python ci/stock_change_impact_ci_check.py
            python ci/stock_ci_learning_summary.py
            python ci/safe_ci_check.py

workflows:
  safe-ci:
    jobs:
      - safe-ci
