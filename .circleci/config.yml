version: 2.1

jobs:
  safe-ci:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Show runtime versions
          command: |
            python --version
            git --version
      - run:
          name: Run safe offline CI checks
          command: python ci/safe_ci_check.py

workflows:
  safe-ci:
    jobs:
      - safe-ci
